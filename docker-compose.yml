services:
  bonsai:
    build: .
    container_name: bonsai-backend
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      # Accesible solo desde la propia máquina. Si usas el perfil "caddy",
      # puedes comentar esta línea: Caddy se encarga de exponerlo.
      - "127.0.0.1:8080:8080"
    environment:
      # El proveedor por defecto es groq, así que su key es la obligatoria.
      # Si pones VISION_PROVIDER=gemini, cambia el ":?" de sitio.
      - VISION_PROVIDER=${VISION_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:?Define GROQ_API_KEY en el fichero .env}
      # Opcional: solo hace falta si pides "provider":"gemini" en /look.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BONSAI_API_TOKEN=${BONSAI_API_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - TTS_PROVIDER=${TTS_PROVIDER:-piper}
      # En el volumen para que los 63 MB del modelo se bajen una sola vez y
      # sobrevivan a las actualizaciones del contenedor.
      - PIPER_VOICES_DIR=/data/voices
      # - GEMINI_VISION_MODEL=gemini-3.1-flash-lite
      # - GROQ_VISION_MODEL=qwen/qwen3.6-27b
    volumes:
      # Aquí vive la base de datos de los recuerdos, para que sobrevivan a
      # reinicios y actualizaciones del contenedor.
      - bonsai-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Proxy inverso con HTTPS automático (Let's Encrypt).
  # Solo se arranca si lo pides:  docker compose --profile caddy up -d
  # Si tu primo ya tiene Nginx/Traefik en el servidor, NO uses este perfil:
  # habría conflicto por los puertos 80 y 443.
  caddy:
    image: caddy:2-alpine
    container_name: bonsai-caddy
    restart: unless-stopped
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BONSAI_DOMAIN=${BONSAI_DOMAIN:?Define BONSAI_DOMAIN en el fichero .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bonsai

  # Administrador de la base de datos: crear tablas, columnas, índices, SQL a
  # mano, importar y exportar. Se arranca solo cuando hace falta:
  #     docker compose --profile admin up -d
  #
  # OJO: esto es acceso SQL completo al fichero. Por eso escucha SOLO en
  # 127.0.0.1 y no se expone nunca a internet. Para llegar desde tu portátil,
  # túnel SSH:
  #     ssh -L 8081:127.0.0.1:8081 usuario@la-vps
  # y luego http://127.0.0.1:8081 en tu navegador.
  #
  # Para el día a día no hace falta: la página /memoria del propio backend ya
  # deja ver y editar los recuerdos sin tocar SQL.
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: bonsai-sqlite-web
    restart: unless-stopped
    profiles: ["admin"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SQLITE_DATABASE=bonsai.db
      # Contraseña además del túnel, por si alguien más entra en la máquina.
      - SQLITE_WEB_PASSWORD=${SQLITE_WEB_PASSWORD:?Define SQLITE_WEB_PASSWORD en el .env}
    volumes:
      - bonsai-data:/data
    working_dir: /data
    command: >
      sqlite_web --host 0.0.0.0 --port 8080 --password --no-browser /data/bonsai.db

volumes:
  bonsai-data:
  caddy-data:
  caddy-config:
