<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0B10'/%3E%3Cg fill='%233B82F6'%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5'/%3E%3Crect x='7' y='14.5' width='18' height='3' rx='1.5'/%3E%3Crect x='7' y='20' width='11' height='3' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<title>Bonsai · provar</title>
<style>
  /* Mateixa paleta que el panell /admin (perfil "Space Tech"): negre i blau.
     Aquí no hi ha mode clar a propòsit: la pàgina es fa servir al carrer i
     amb el mòbil a la mà, i el fons fosc cansa menys de nit. */
  :root {
    color-scheme: dark;
    --bg:#0B0B10; --surface:#121218; --card:#1A1A21;
    --line:#242430; --line2:#33333F;
    --fg:#F8FAFC; --dim:#A1A1B5; --faint:#6C6C82;
    --accent:#3B82F6; --accent2:#60A5FA; --danger:#EF4444;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

  /* Capçalera igual que la del panell */
  header {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  header .marca { font-weight:600; font-size:.95rem; }
  header .sep { flex:1; }
  header a {
    color:var(--dim); font-size:.82rem; text-decoration:none;
    transition:color .15s;
  }
  header a:hover { color:var(--accent2); text-decoration:underline; }
  .logo { width:18px; height:18px; flex:none; }

  /* La pàgina està pensada per al mòbil. A l'ordinador es queda centrada i amb
     la mateixa amplada, que estirar-la a 1.400 px no la fa més útil. */
  main {
    max-width:560px; margin:0 auto;
    padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  .sub { color:var(--faint); font-size:.85rem; margin:0 0 16px; }

  .card {
    background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:14px; margin-bottom:12px;
  }
  label {
    display:block; font-size:.7rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; color:var(--faint); margin-bottom:5px;
  }
  select, input[type=text] {
    width:100%; padding:11px; font-size:16px; border-radius:8px;
    border:1px solid var(--line2); background:var(--bg); color:var(--fg);
    transition:border-color .15s;
  }
  select:focus, input[type=text]:focus { outline:none; border-color:var(--accent); }
  input[type=text]::placeholder { color:var(--faint); }
  .fila { display:flex; gap:10px; }
  .fila > div { flex:1; min-width:0; }
  .espai { height:10px; }

  /* Botó gran: es fa servir amb una mà, caminant pel carrer. */
  button {
    width:100%; padding:18px; font-size:1.05rem; font-weight:600;
    border:0; border-radius:10px; background:var(--accent); color:#fff;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  button:hover:not(:disabled) { background:var(--accent2); }
  button:disabled { opacity:.45; cursor:default; }
  input[type=file] { display:none; }

  .check { display:flex; align-items:center; gap:9px; margin-top:12px; }
  .check input { width:19px; height:19px; accent-color:var(--accent); flex:none; }
  .check label {
    margin:0; text-transform:none; letter-spacing:0; font-size:.88rem;
    font-weight:400; color:var(--dim);
  }

  #sortida:empty { display:none; }
  .text { font-size:1.2rem; line-height:1.45; margin:0 0 12px; }
  audio, img { width:100%; border-radius:8px; }
  img { margin-bottom:12px; }

  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  td { padding:6px 0; border-bottom:1px solid var(--line); color:var(--dim); }
  tr:last-child td { border-bottom:0; }
  td:last-child {
    text-align:right; font-variant-numeric:tabular-nums; color:var(--fg);
    font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  tr.total td { color:var(--fg); font-weight:600; }
  tr.total td:last-child { color:var(--accent2); }

  .err { color:var(--danger); white-space:pre-wrap; font-size:.9rem; margin:0; }
  .nota { font-size:.78rem; color:var(--faint); margin:10px 0 0; }

  *:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><g fill="#3B82F6">
    <rect x="4" y="7" width="24" height="4" rx="2"/>
    <rect x="4" y="14" width="24" height="4" rx="2"/>
    <rect x="4" y="21" width="15" height="4" rx="2"/>
  </g></svg>
  <span class="marca">Bonsai · provar</span>
  <span class="sep"></span>
  <a href="/admin">Base de dades</a>
</header>

<main>
<p class="sub">Fes una foto i escolta què tens al davant.</p>

<div class="card">
  <div class="fila">
    <div>
      <label for="prov">Proveïdor</label>
      <select id="prov">
        <option value="">Per defecte</option>
        <option value="groq">Groq</option>
        <option value="gemini">Gemini</option>
      </select>
    </div>
    <div>
      <label for="lang">Idioma</label>
      <select id="lang">
        <option value="ca">Català</option>
        <option value="es">Castellà</option>
        <option value="en">Anglès</option>
      </select>
    </div>
  </div>
  <div class="espai"></div>
  <label for="tts">Veu</label>
  <select id="tts">
    <option value="">Per defecte</option>
    <option value="piper">Piper (local, ~205 ms)</option>
    <option value="edge">edge-tts (Microsoft, ~1,3 s)</option>
  </select>
  <div class="check">
    <input type="checkbox" id="reduir" checked>
    <label for="reduir">Reduir a 896 px abans de pujar-la</label>
  </div>
</div>

<div class="card">
  <label for="prompt">Pregunta (opcional)</label>
  <input type="text" id="prompt" placeholder="Què diu el cartell?" enterkeyhint="done">
  <div class="espai"></div>
  <label for="token">Token, si el servidor el demana</label>
  <input type="text" id="token" placeholder="X-API-Token" autocomplete="off" spellcheck="false">
</div>

<button id="btn">Fer una foto</button>
<!-- capture=environment obre la càmera del darrere. Funciona sense HTTPS, que
     és el que permet provar-ho per IP local sense muntar cap certificat. -->
<input type="file" id="file" accept="image/*" capture="environment">

<div id="sortida"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const sortida = $("sortida");
// La pàgina la serveix el mateix backend, així que l'API és al mateix origen.
const API = location.origin;
const escapa = s => String(s).replace(/[<&]/g, c => ({"<":"&lt;","&":"&amp;"}[c]));

$("btn").onclick = () => $("file").click();

// Recorda els ajustos entre fotos: provar des del mòbil és repetir molt.
for (const id of ["prov", "lang", "tts", "token", "reduir"]) {
  const el = $(id), desat = localStorage.getItem("bonsai." + id);
  if (desat !== null) el[el.type === "checkbox" ? "checked" : "value"] = desat === "true" ? true : desat === "false" ? false : desat;
  el.onchange = () => localStorage.setItem("bonsai." + id, el.type === "checkbox" ? el.checked : el.value);
}

/* Redueix al mòbil abans de pujar-la. Amb dades mòbils la pujada és la part
   més lenta de totes: una foto de 12 MP són ~3 MB, i a 896 px són ~60 KB. */
async function aBase64(file) {
  if (!$("reduir").checked) {
    const buf = await file.arrayBuffer();
    let s = ""; const b = new Uint8Array(buf);
    for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode(...b.subarray(i, i + 8192));
    return { b64: btoa(s), bytes: b.length };
  }
  const bitmap = await createImageBitmap(file);  // respecta l'orientació EXIF
  const f = Math.min(1, 896 / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bitmap.width * f);
  c.height = Math.round(bitmap.height * f);
  c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.8);
  const b64 = url.split(",")[1];
  return { b64, bytes: Math.round(b64.length * 0.75), w: c.width, h: c.height };
}

$("file").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = "";  // permet repetir amb la mateixa foto

  $("btn").disabled = true;
  $("btn").textContent = "Processant…";
  sortida.innerHTML = "";

  const t0 = performance.now();
  try {
    const prep = await aBase64(file);
    const tPrep = performance.now() - t0;

    const cos = {
      deviceId: "movil",
      image: prep.b64,
      lang: $("lang").value,
      // wav perquè el navegador el reprodueix tal qual. L'ESP32 demana pcm16.
      audioFormat: "wav",
    };
    if ($("prov").value) cos.provider = $("prov").value;
    if ($("tts").value) cos.tts = $("tts").value;
    if ($("prompt").value.trim()) cos.prompt = $("prompt").value.trim();

    const cap = { "Content-Type": "application/json" };
    if ($("token").value.trim()) cap["X-API-Token"] = $("token").value.trim();

    const tReq = performance.now();
    const r = await fetch(API + "/look", {
      method: "POST", headers: cap, body: JSON.stringify(cos),
    });

    if (!r.ok) {
      const cosErr = await r.text();
      let msg = `HTTP ${r.status}`;
      if (r.status === 429) {
        const esperar = r.headers.get("Retry-After");
        msg += esperar ? ` — quota esgotada, torna-ho a provar d'aquí ${esperar} s` : " — quota esgotada";
      }
      try { msg += "\n" + (JSON.parse(cosErr).detail || cosErr); } catch { msg += "\n" + cosErr; }
      throw new Error(msg);
    }

    // El text arriba en una capçalera, no al cos: el cos és l'àudio. Va en
    // base64 perquè les capçaleres HTTP només admeten ASCII.
    const text = new TextDecoder().decode(
      Uint8Array.from(atob(r.headers.get("X-Bonsai-Text")), c => c.charCodeAt(0)));
    const visioMs = Number(r.headers.get("X-Bonsai-Vision-Ms") || 0);
    const resizeMs = Number(r.headers.get("X-Bonsai-Resize-Ms") || 0);
    const format = r.headers.get("X-Bonsai-Format") || "wav";

    // El primer byte és el que importa: és quan l'ESP32 podria començar a
    // sonar. Es mesura llegint el stream a mà en comptes d'esperar el blob.
    const lector = r.body.getReader();
    const trossos = []; let primerByte = null, total = 0;
    while (true) {
      const { done, value } = await lector.read();
      if (done) break;
      if (primerByte === null) primerByte = performance.now() - tReq;
      trossos.push(value); total += value.length;
    }
    const msReq = performance.now() - tReq;
    const blob = new Blob(trossos, { type: format === "mp3" ? "audio/mpeg" : "audio/wav" });

    const totalMs = performance.now() - t0;
    const files = [
      ["Preparar la imatge", `${tPrep.toFixed(0)} ms`],
      ["Reduir (servidor)", `${resizeMs} ms`],
      ["Visió", `${visioMs} ms`],
      ["Primer byte d'àudio", `${primerByte === null ? "—" : primerByte.toFixed(0) + " ms"}`],
      ["Àudio complet", `${msReq.toFixed(0)} ms`],
      ["Enviat / rebut", `${(prep.bytes / 1024).toFixed(0)} KB / ${(total / 1024).toFixed(0)} KB`],
      ["Model", `${r.headers.get("X-Bonsai-Provider")} · ${r.headers.get("X-Bonsai-Model")}`],
      ["Veu", `${r.headers.get("X-Bonsai-Tts")} · ${r.headers.get("X-Bonsai-Voice")}`],
    ];

    sortida.innerHTML = `<div class="card">
      <p class="text">${escapa(text)}</p>
      <audio controls autoplay src="${URL.createObjectURL(blob)}"></audio>
    </div>
    <div class="card"><table>${
      files.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")
    }<tr class="total"><td>TOTAL</td><td>${totalMs.toFixed(0)} ms</td></tr></table></div>`;
  } catch (err) {
    sortida.innerHTML = `<div class="card"><p class="err">${escapa(err.message || err)
    }</p><p class="nota">Si diu «Failed to fetch», comprova que el mòbil arriba al servidor: mateixa WiFi i la IP correcta.</p></div>`;
  } finally {
    $("btn").disabled = false;
    $("btn").textContent = "Fer una altra foto";
  }
};
</script>
</body>
</html>
