<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ctext%20y%3D%2226%22%20font-size%3D%2226%22%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<title>Bonsai — memòria</title>
<style>
:root {
  color-scheme: dark light;
  --bg:#0e1110; --bg2:#141917; --card:#181d1b; --card2:#1e2422;
  --line:#252d2a; --line2:#313b37;
  --fg:#e6ebe8; --dim:#8b9a93; --faint:#5d6b65;
  --ac:#4ade80; --ac-dim:#22543d; --ac-fg:#052e16;
  --bad:#f87171; --warn:#fbbf24;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#f6f8f7; --bg2:#fff; --card:#fff; --card2:#f2f5f3;
    --line:#e3e9e6; --line2:#d1dad6;
    --fg:#131816; --dim:#5f6d67; --faint:#93a29b;
    --ac:#16a34a; --ac-dim:#bbf7d0; --ac-fg:#fff;
    --bad:#dc2626; --warn:#b45309;
    --sh:0 1px 2px rgba(16,24,20,.04), 0 8px 24px -14px rgba(16,24,20,.18);
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---------- capçalera ---------- */
header {
  position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.hwrap { max-width:1180px; margin:0 auto; padding:13px 22px;
         display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.marca { display:flex; align-items:center; gap:9px; font-weight:650; letter-spacing:-.01em; }
.marca .pt { width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
             background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#0a6));
             font-size:14px; }
.kpis { margin-left:auto; display:flex; gap:8px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:10px;
       padding:6px 12px; min-width:78px; }
.kpi b { display:block; font-size:1.05rem; font-variant-numeric:tabular-nums; line-height:1.25; }
.kpi span { font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }

/* ---------- disposició ---------- */
main { max-width:1180px; margin:0 auto; padding:22px;
       display:grid; grid-template-columns:262px 1fr; gap:22px; align-items:start; }
@media (max-width:820px) { main { grid-template-columns:1fr; padding:16px; gap:16px; } }

.panel { background:var(--card); border:1px solid var(--line);
         border-radius:var(--r); box-shadow:var(--sh); }
.panel > h2 { margin:0; padding:13px 16px 11px; font-size:.7rem; font-weight:600;
              text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
              border-bottom:1px solid var(--line); }
.pbody { padding:12px; }

/* ---------- dispositius ---------- */
.disp { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px;
        border:1px solid transparent; border-radius:10px; background:none; color:var(--fg);
        font:inherit; text-align:left; cursor:pointer; transition:background .12s,border-color .12s; }
.disp:hover { background:var(--card2); }
.disp[aria-current="true"] { background:var(--card2); border-color:color-mix(in srgb,var(--ac) 45%,transparent); }
.disp .av { width:28px; height:28px; border-radius:8px; flex:none; display:grid; place-items:center;
            background:var(--ac-dim); color:var(--ac); font-size:.72rem; font-weight:700; }
.disp[aria-current="true"] .av { background:var(--ac); color:var(--ac-fg); }
.disp .nom { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
             font-size:.92rem; }
.disp .n { font-size:.72rem; color:var(--faint); font-variant-numeric:tabular-nums;
           background:var(--bg2); border:1px solid var(--line); border-radius:20px; padding:1px 7px; }

/* ---------- controls ---------- */
input[type=text], input[type=search], textarea {
  width:100%; padding:10px 12px; font:inherit; color:var(--fg);
  background:var(--bg2); border:1px solid var(--line2); border-radius:10px;
  transition:border-color .12s, box-shadow .12s;
}
input:focus, textarea:focus { outline:none; border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent); }
::placeholder { color:var(--faint); }
textarea { resize:vertical; min-height:74px; line-height:1.5; }

.btn { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 16px;
       background:var(--ac); color:var(--ac-fg); cursor:pointer; transition:filter .12s; }
.btn:hover { filter:brightness(1.08); }
.btn:disabled { opacity:.45; cursor:default; filter:none; }
.btn.ghost { background:none; color:var(--dim); border:1px solid var(--line2); font-weight:500;
             padding:6px 11px; font-size:.85rem; }
.btn.ghost:hover { color:var(--fg); border-color:var(--faint); background:var(--card2); }
.btn.ghost.danger:hover { color:var(--bad); border-color:var(--bad);
                          background:color-mix(in srgb,var(--bad) 9%,transparent); }
.btn.mini { padding:4px 9px; font-size:.8rem; }

/* ---------- records ---------- */
.cap { display:flex; align-items:center; gap:12px; padding:11px 14px;
       border-bottom:1px solid var(--line); }
.cap h2 { margin:0; padding:0; border:0; font-size:.7rem; letter-spacing:.09em;
          text-transform:uppercase; color:var(--faint); font-weight:600; }
.cap .cerca { margin-left:auto; max-width:230px; }
.cap .cerca input { padding:6px 11px; font-size:.87rem; border-radius:8px; }

.rec { display:flex; gap:12px; align-items:flex-start; padding:13px 16px;
       border-bottom:1px solid var(--line); transition:background .1s; }
.rec:last-child { border-bottom:0; }
.rec:hover { background:var(--card2); }
.rec .bala { width:6px; height:6px; border-radius:50%; background:var(--ac);
             margin-top:9px; flex:none; opacity:.55; }
.rec .cos { flex:1; min-width:0; overflow-wrap:anywhere; }
.rec .txt { line-height:1.5; }
.rec .meta { color:var(--faint); font-size:.75rem; margin-top:4px;
             display:flex; gap:9px; align-items:center; }
.rec .meta code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em; }
.acc { display:flex; gap:6px; flex:none; opacity:0; transition:opacity .12s; }
.rec:hover .acc, .rec:focus-within .acc { opacity:1; }
@media (hover:none) { .acc { opacity:1; } }

.buit { padding:44px 20px; text-align:center; color:var(--dim); }
.buit .ic { font-size:1.9rem; opacity:.5; display:block; margin-bottom:8px; }
.buit p { margin:4px 0 0; font-size:.88rem; color:var(--faint); }

.pista { color:var(--faint); font-size:.75rem; margin-top:9px; }
kbd { font:inherit; font-size:.85em; background:var(--bg2); border:1px solid var(--line2);
      border-bottom-width:2px; border-radius:5px; padding:0 5px; }

/* ---------- avisos ---------- */
/* Arriba y no abajo: abajo a la derecha tapaba los botones de confirmar
   borrado de la última fila, que es justo cuando más falta hace verlos. */
#avisos { position:fixed; right:18px; top:64px; z-index:60;
          display:flex; flex-direction:column; gap:8px; align-items:flex-end;
          pointer-events:none; }
.avis { background:var(--card); border:1px solid var(--line2); border-left:3px solid var(--ac);
        border-radius:10px; padding:10px 14px; box-shadow:var(--sh); font-size:.88rem;
        max-width:330px; animation:entra .18s ease-out; }
.avis.err { border-left-color:var(--bad); color:var(--bad); white-space:pre-wrap; }
@keyframes entra { from { opacity:0; transform:translateY(-6px); } }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="marca"><span class="pt">🧠</span> Memòria de Bonsai</div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<main>
  <aside>
    <div class="panel">
      <h2>Dispositius</h2>
      <div class="pbody">
        <div id="dispositius"></div>
        <div style="height:10px"></div>
        <input type="text" id="nouDisp" placeholder="Obrir-ne un altre…" autocomplete="off">
      </div>
    </div>
  </aside>

  <section>
    <div class="panel" style="margin-bottom:16px">
      <h2>Afegir un record a <span id="desti" style="color:var(--ac)">—</span></h2>
      <div class="pbody">
        <textarea id="nou" placeholder="El Biel pren el cafè sense sucre"></textarea>
        <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
          <button class="btn" id="btnAfegir">Afegir record</button>
          <span class="pista"><kbd>Ctrl</kbd>+<kbd>↵</kbd> per desar</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="cap">
        <h2>Records <span id="compte"></span></h2>
        <div class="cerca"><input type="search" id="cerca" placeholder="Cercar…  /"></div>
      </div>
      <div id="records"></div>
    </div>
  </section>
</main>

<div id="avisos"></div>

<script>
const $ = id => document.getElementById(id);
const API = location.origin;
let dispositiu = null, records = [], filtre = "";
let token = localStorage.getItem("bonsai.token") || "";

const esc = s => String(s).replace(/[<&>"]/g, c =>
  ({"<":"&lt;","&":"&amp;",">":"&gt;",'"':"&quot;"}[c]));

function avis(text, esError = false) {
  const el = document.createElement("div");
  el.className = "avis" + (esError ? " err" : "");
  el.textContent = text;
  $("avisos").append(el);
  // Los errores se quedan más rato: hay que poder leerlos.
  setTimeout(() => el.remove(), esError ? 7000 : 2600);
}

async function api(ruta, opcions = {}) {
  const cap = { "Content-Type": "application/json" };
  if (token) cap["X-API-Token"] = token;
  const r = await fetch(API + ruta, { ...opcions, headers: cap });
  if (r.status === 401) {
    const t = prompt("Aquest servidor demana un token (X-API-Token):", token);
    if (t === null) throw new Error("Cal un token per continuar.");
    token = t.trim(); localStorage.setItem("bonsai.token", token);
    return api(ruta, opcions);
  }
  if (!r.ok) {
    let d = await r.text();
    try { d = JSON.parse(d).detail || d; } catch {}
    throw new Error(`HTTP ${r.status} · ${d}`);
  }
  return r.status === 204 ? null : r.json();
}

function quan(iso) {
  const d = new Date(iso), min = Math.round((new Date() - d) / 60000);
  if (min < 1) return "ara mateix";
  if (min < 60) return `fa ${min} min`;
  if (min < 1440) return `fa ${Math.round(min / 60)} h`;
  if (min < 43200) return `fa ${Math.round(min / 1440)} dies`;
  return d.toLocaleDateString("ca-ES", { day: "numeric", month: "short", year: "numeric" });
}

const inicials = s => s.replace(/[^a-z0-9]/gi, "").slice(0, 2).toUpperCase() || "··";

async function carregarDispositius() {
  try {
    const d = await api("/memory");
    const s = d.stats;
    $("kpis").innerHTML = `
      <div class="kpi"><b>${s.memories}</b><span>records</span></div>
      <div class="kpi"><b>${s.devices}</b><span>dispositius</span></div>
      <div class="kpi"><b>${(s.dbBytes / 1024).toFixed(0)}<small style="font-size:.6em"> KB</small></b><span>base de dades</span></div>`;
    $("dispositius").innerHTML = d.devices.length
      ? d.devices.map(x => `
          <button class="disp" data-d="${esc(x.device_id)}" aria-current="${x.device_id === dispositiu}">
            <span class="av">${esc(inicials(x.device_id))}</span>
            <span class="nom" title="${esc(x.device_id)}">${esc(x.device_id)}</span>
            <span class="n">${x.total}</span>
          </button>`).join("")
      : `<div class="buit" style="padding:18px 6px"><span class="ic">🌱</span>
         Cap dispositiu<p>Escriu-ne un a sota per començar.</p></div>`;
    for (const b of $("dispositius").querySelectorAll(".disp"))
      b.onclick = () => obrir(b.dataset.d);
  } catch (e) { avis(e.message, true); }
}

async function obrir(d) {
  dispositiu = d;
  $("desti").textContent = d;
  for (const b of $("dispositius").querySelectorAll(".disp"))
    b.setAttribute("aria-current", b.dataset.d === d);
  await carregarRecords();
}

async function carregarRecords() {
  if (!dispositiu) return;
  try {
    records = (await api(`/memory/${encodeURIComponent(dispositiu)}`)).memories;
    pintar();
  } catch (e) { avis(e.message, true); }
}

function pintar() {
  const f = filtre.trim().toLowerCase();
  const llista = f ? records.filter(m => m.fact.toLowerCase().includes(f)) : records;
  $("compte").textContent = f ? `${llista.length} de ${records.length}` : `${records.length}`;

  if (!llista.length) {
    $("records").innerHTML = records.length
      ? `<div class="buit"><span class="ic">🔍</span>Cap record amb «${esc(filtre)}»</div>`
      : `<div class="buit"><span class="ic">💭</span>Aquest dispositiu no recorda res
         <p>El que afegeixis aquí s'enviarà al model a cada foto.</p></div>`;
    return;
  }

  $("records").innerHTML = llista.map(m => `
    <div class="rec" data-id="${esc(m.id)}">
      <span class="bala"></span>
      <div class="cos">
        <div class="txt">${esc(m.fact)}</div>
        <div class="meta">${quan(m.created_at)} · <code>${esc(m.id.slice(0, 8))}</code></div>
      </div>
      <div class="acc">
        <button class="btn ghost mini ed">Editar</button>
        <button class="btn ghost mini danger del">Esborrar</button>
      </div>
    </div>`).join("");

  for (const fila of $("records").querySelectorAll(".rec")) {
    const id = fila.dataset.id;
    fila.querySelector(".del").onclick = () => esborrar(fila, id);
    fila.querySelector(".ed").onclick = () => editar(fila, id);
  }
}

function editar(fila, id) {
  const cos = fila.querySelector(".cos");
  const actual = cos.querySelector(".txt").textContent;
  cos.innerHTML = `<textarea class="e">${esc(actual)}</textarea>
    <div style="display:flex;gap:7px;margin-top:8px">
      <button class="btn mini ok" style="padding:6px 13px">Desar</button>
      <button class="btn ghost mini no">Cancel·lar</button>
    </div>`;
  fila.querySelector(".acc").style.visibility = "hidden";
  const ta = cos.querySelector("textarea");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);

  const desar = async () => {
    try {
      await api(`/memory/${encodeURIComponent(dispositiu)}/${id}`,
                { method: "PATCH", body: JSON.stringify({ fact: ta.value }) });
      avis("Record actualitzat");
      await carregarRecords();
    } catch (e) { avis(e.message, true); }
  };
  cos.querySelector(".ok").onclick = desar;
  cos.querySelector(".no").onclick = pintar;
  ta.onkeydown = e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) desar();
    if (e.key === "Escape") pintar();
  };
}

// Confirmación en la propia fila: un confirm() del navegador corta el ritmo y
// además no se puede leer el texto de lo que estás borrando.
function esborrar(fila, id) {
  const acc = fila.querySelector(".acc");
  acc.innerHTML = `<span style="color:var(--dim);font-size:.82rem;align-self:center">Segur?</span>
    <button class="btn ghost mini danger si">Sí, esborrar</button>
    <button class="btn ghost mini no">No</button>`;
  acc.style.opacity = "1";
  acc.querySelector(".no").onclick = pintar;
  acc.querySelector(".si").onclick = async () => {
    try {
      await api(`/memory/${encodeURIComponent(dispositiu)}/${id}`, { method: "DELETE" });
      avis("Record esborrat");
      await carregarRecords(); await carregarDispositius();
    } catch (e) { avis(e.message, true); }
  };
}

$("btnAfegir").onclick = async () => {
  const fact = $("nou").value.trim();
  if (!fact) { $("nou").focus(); return; }
  if (!dispositiu) { avis("Tria abans un dispositiu.", true); return; }
  $("btnAfegir").disabled = true;
  try {
    await api("/memory", { method: "POST",
      body: JSON.stringify({ deviceId: dispositiu, fact }) });
    $("nou").value = "";
    avis("Record afegit");
    await carregarRecords(); await carregarDispositius();
  } catch (e) { avis(e.message, true); }
  finally { $("btnAfegir").disabled = false; }
};

$("nou").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("btnAfegir").click();
});
$("cerca").addEventListener("input", e => { filtre = e.target.value; pintar(); });
$("nouDisp").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) {
    obrir(e.target.value.trim()); e.target.value = "";
  }
});
// "/" para buscar, como en cualquier sitio con buscador.
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); $("cerca").focus();
  }
});

(async () => {
  await carregarDispositius();
  const primer = $("dispositius").querySelector(".disp");
  if (primer) obrir(primer.dataset.d);
})();
</script>
</body>
</html>
